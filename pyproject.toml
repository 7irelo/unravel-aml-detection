[project]
name = "unravel"
version = "0.1.0"
description = "AML monitoring: streaming features, tree and graph detection, and a cited LLM investigator with human approval."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
  "polars>=1.20",
  "pyarrow>=18",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "typer>=0.15",
]

[project.optional-dependencies]
ml = ["lightgbm>=4.5", "xgboost>=2.1", "scikit-learn>=1.6", "shap>=0.46", "optuna>=4.1", "scipy>=1.14"]
gnn = ["torch>=2.4", "torch-geometric>=2.6"]
streaming = ["confluent-kafka>=2.6", "prometheus-client>=0.21"]
agent = ["anthropic>=0.70", "langgraph>=0.6", "langgraph-checkpoint-postgres>=2.0", "psycopg[binary,pool]>=3.2"]
api = ["fastapi>=0.115", "uvicorn>=0.32", "streamlit>=1.40", "httpx>=0.27", "psycopg[binary,pool]>=3.2"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6", "hypothesis>=2.0", "ruff>=0.8", "mypy>=1.13", "pre-commit>=4", "detect-secrets>=1.5"]

[project.scripts]
unravel = "unravel.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unravel"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PIE", "PT"]
ignore = ["N803", "N806", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = false
warn_unused_ignores = false
ignore_missing_imports = true
files = ["src/unravel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: needs Docker services",
  "live_llm: spends real LLM money",
  "real_data: needs the downloaded AMLworld data",
]
